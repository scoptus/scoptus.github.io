<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kategori Produk — Scoptus</title>
    <link rel="icon" type="image/png" href="logo.png">
    <script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <style>
        :root {
            --navy: #0d1b3e;
            --navy-light: #1a2f5a;
            --tosca: #00b4d8;
            --tosca-light: #48cae4;
            --tosca-dark: #0096b7;
            --white: #ffffff;
            --gray-light: #f8f9fa;
            --gray: #6c757d;
            --shopee: #ee4d2d;
            --shopee-light: #ff6633;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        html { scroll-behavior: smooth; }

        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background: var(--gray-light);
            color: #333;
            line-height: 1.6;
            overflow-x: hidden;
        }

        /* NAVBAR GLASSMORPHISM */
        .navbar {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            padding: 15px 5%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: fixed;
            top: 0;
            width: 100%;
            z-index: 1000;
            box-shadow: 0 2px 20px rgba(0,0,0,0.05);
            transition: all 0.3s;
        }
        .navbar.scrolled {
            padding: 10px 5%;
            box-shadow: 0 4px 30px rgba(0,0,0,0.1);
        }
        .navbar .logo {
            display: flex;
            align-items: center;
            gap: 10px;
            text-decoration: none;
        }
        .navbar .logo img { height: 40px; }
        .navbar .logo span {
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--navy);
        }
        .navbar .nav-links { display: flex; gap: 20px; align-items: center; }
        .navbar .nav-links a {
            color: var(--navy);
            text-decoration: none;
            font-size: 0.95rem;
            font-weight: 500;
            transition: color 0.3s;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .navbar .nav-links a:hover { color: var(--tosca); }
        .navbar .nav-links .btn-admin {
            background: var(--tosca);
            color: var(--white);
            padding: 8px 20px;
            border-radius: 25px;
            font-weight: 600;
        }
        .navbar .nav-links .btn-admin:hover { background: var(--tosca-dark); }

        /* HERO SECTION dengan PARALLAX */
        .hero {
            position: relative;
            min-height: 50vh;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            background: linear-gradient(135deg, var(--navy) 0%, var(--navy-light) 50%, var(--tosca-dark) 100%);
            color: var(--white);
            padding: 140px 5% 80px;
            overflow: hidden;
        }
        
        /* Parallax Shapes */
        .parallax-shape {
            position: absolute;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 30% 70% 70% 30% / 30% 30% 70% 70%;
            animation: morphing 15s infinite ease-in-out;
        }
        .shape-1 { width: 300px; height: 300px; top: 10%; left: 5%; animation-delay: 0s; }
        .shape-2 { width: 250px; height: 250px; bottom: 10%; right: 10%; animation-delay: -5s; }
        .shape-3 { width: 150px; height: 150px; top: 40%; left: 40%; animation-delay: -2s; }

        @keyframes morphing {
            0%, 100% { border-radius: 30% 70% 70% 30% / 30% 30% 70% 70%; transform: rotate(0deg); }
            50% { border-radius: 70% 30% 30% 70% / 70% 70% 30% 30%; transform: rotate(180deg); }
        }

        .hero-content { position: relative; z-index: 2; }
        
        .hero h1 {
            font-size: 2.8rem;
            margin-bottom: 15px;
            line-height: 1.2;
            text-shadow: 0 4px 20px rgba(0,0,0,0.3);
            animation: fadeInUp 0.8s ease-out;
        }
        .hero h1 i { color: var(--tosca-light); margin-right: 15px; }
        
        .hero p {
            font-size: 1.1rem;
            opacity: 0.9;
            animation: fadeInUp 0.8s ease-out 0.2s both;
        }

        /* BREADCRUMB */
        .breadcrumb {
            padding: 15px 5%;
            max-width: 1200px;
            margin: 0 auto;
            font-size: 0.9rem;
            color: var(--gray);
        }
        .breadcrumb a { color: var(--tosca-dark); text-decoration: none; font-weight: 500; }
        .breadcrumb a:hover { text-decoration: underline; }
        .breadcrumb span { margin: 0 8px; }

        /* PRODUCT GRID */
        .products-container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px 5% 80px;
        }
        .products-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(270px, 1fr));
            gap: 30px;
            perspective: 1000px;
        }

        /* 3D PRODUCT CARD */
        .product-card {
            background: var(--white);
            border-radius: 24px;
            overflow: hidden;
            box-shadow: 0 10px 40px rgba(0,0,0,0.08);
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            position: relative;
            transform-style: preserve-3d;
            opacity: 0;
            animation: fadeInUp 0.6s ease-out forwards;
        }
        .product-card:hover {
            transform: translateY(-10px) rotateX(5deg);
            box-shadow: 0 20px 60px rgba(0, 180, 216, 0.15);
        }

        .product-img-wrapper {
            position: relative;
            height: 220px;
            overflow: hidden;
            background: #f0f2f5;
        }
        .product-card .product-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.5s;
        }
        .product-card:hover .product-img {
            transform: scale(1.1);
        }
        
        .product-img-placeholder {
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, #e0e0e0, #f5f5f5);
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--gray);
            font-size: 3rem;
        }

        .product-info { padding: 25px; }
        
        .product-info h3 {
            font-size: 1.1rem;
            color: var(--navy);
            margin-bottom: 10px;
            font-weight: 700;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }
        
        .product-info .description {
            font-size: 0.9rem;
            color: var(--gray);
            margin-bottom: 20px;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
            line-height: 1.5;
        }

        .btn-shopee {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            width: 100%;
            background: linear-gradient(135deg, var(--shopee), var(--shopee-light));
            color: var(--white);
            padding: 12px;
            text-decoration: none;
            font-weight: 600;
            border-radius: 15px;
            transition: all 0.3s;
            box-shadow: 0 4px 15px rgba(238, 77, 45, 0.3);
        }
        .btn-shopee:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(238, 77, 45, 0.4);
        }

        /* EMPTY STATE & LOADING */
        .empty-state {
            text-align: center;
            padding: 80px 20px;
            background: var(--white);
            border-radius: 24px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.05);
            grid-column: 1 / -1;
        }
        .empty-state i { font-size: 4rem; color: #eee; margin-bottom: 20px; }
        .empty-state h3 { color: var(--navy); margin-bottom: 10px; }

        .loading {
            text-align: center;
            padding: 80px;
            color: var(--gray);
            grid-column: 1 / -1;
        }
        .loading i { 
            font-size: 3rem; color: var(--tosca); 
            animation: spin 1s linear infinite;
            margin-bottom: 15px; 
            display: block;
        }
        @keyframes spin { 100% { transform: rotate(360deg); } }
        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* FOOTER */
        footer {
            background: var(--navy);
            color: var(--white);
            text-align: center;
            padding: 40px 5%;
            position: relative;
        }
        footer::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 4px;
            background: linear-gradient(90deg, var(--tosca), var(--tosca-light));
        }
        footer p { opacity: 0.7; font-size: 0.9rem; }

        /* RESPONSIVE */
        @media (max-width: 768px) {
            .hero h1 { font-size: 1.8rem; }
            .products-grid { grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 20px; }
            .product-img-wrapper { height: 160px; }
            .product-info { padding: 15px; }
            .navbar .nav-links a:not(.btn-admin) { display: none; }
        }
    </style>
</head>
<body>

<!-- NAVBAR -->
<nav class="navbar" id="navbar">
    <a href="index.html" class="logo">
        <img src="logo.png" alt="Scoptus Logo">
        <span>Scoptus</span>
    </a>
    <div class="nav-links">
        <a href="index.html"><i class="fas fa-arrow-left"></i> Kembali</a>
        <a href="admin.html" class="btn-admin"><i class="fas fa-lock"></i> Admin</a>
    </div>
</nav>

<!-- HERO HEADER -->
<section class="hero">
    <div class="parallax-shape shape-1"></div>
    <div class="parallax-shape shape-2"></div>
    <div class="parallax-shape shape-3"></div>
    
    <div class="hero-content">
        <h1><i class="fas fa-tag"></i> <span id="categoryTitle">Memuat...</span></h1>
        <p id="categoryDesc">Menampilkan semua produk dalam kategori ini</p>
    </div>
</section>

<!-- BREADCRUMB -->
<div class="breadcrumb">
    <a href="index.html"><i class="fas fa-home"></i> Home</a>
    <span>›</span>
    <span id="breadcrumbCat">Kategori</span>
</div>

<!-- PRODUCTS -->
<div class="products-container">
    <div id="productsArea" class="loading">
        <i class="fas fa-spinner"></i>
        <p>Memuat produk...</p>
    </div>
</div>

<!-- FOOTER -->
<footer>
    <p>&copy; 2026 Scoptus. All rights reserved.</p>
</footer>

<script>
    // ====== PARALLAX SCROLL EFFECT ======
    window.addEventListener('scroll', () => {
        const scrolled = window.pageYOffset;
        const parallaxElements = document.querySelectorAll('.parallax-shape');
        
        parallaxElements.forEach((el, index) => {
            const speed = 0.3 + (index * 0.1);
            el.style.transform = `translateY(${scrolled * speed}px) rotate(${scrolled * 0.2}deg)`;
        });
        
        // Navbar shrink effect
        const navbar = document.getElementById('navbar');
        if (scrolled > 50) {
            navbar.classList.add('scrolled');
        } else {
            navbar.classList.remove('scrolled');
        }
    });

    // ====== KONFIGURASI ======
    const CSV_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vQKiqz17i6JMHkQaODY2tdLDQeiZEhhbxFA1a7H-xp-Gz3m8MOim4LU9LJy8kf_G-t9s8o4Q8oN0IQV/pub?gid=0&single=true&output=csv';

    const CATEGORY_ICONS = {
        'Home Decor': 'fa-home',
        'Gadget & Daily Essentials': 'fa-mobile-screen',
        'Fashion': 'fa-shirt',
        'Electronic & Parts': 'fa-microchip',
        'Grocery': 'fa-basket-shopping'
    };

    // ====== GET CATEGORY FROM URL ======
    const params = new URLSearchParams(window.location.search);
    const category = params.get('cat') || '';

    // ====== SET PAGE TITLE ======
    if (category) {
        const icon = CATEGORY_ICONS[category] || 'fa-box';
        document.getElementById('categoryTitle').innerHTML = `${category}`;
        document.getElementById('categoryTitle').insertAdjacentHTML('afterbegin', `<i class="fas ${icon}"></i> `);
        document.getElementById('breadcrumbCat').textContent = category;
        document.title = `${category} — Scoptus`;
        document.getElementById('categoryDesc').textContent = `Jelajahi produk terbaik di kategori ${category}`;
    } else {
        document.getElementById('categoryTitle').textContent = 'Semua Produk';
    }

    // ====== LOAD PRODUCTS ======
    async function loadProducts() {
        const area = document.getElementById('productsArea');

        try {
            const response = await fetch(CSV_URL);
            const csvText = await response.text();
            const parsed = Papa.parse(csvText, { header: true, skipEmptyLines: true });
            let products = parsed.data;

            // Filter by category
            if (category) {
                products = products.filter(p => 
                    p.kategori && p.kategori.trim().toLowerCase() === category.toLowerCase()
                );
            }

            if (products.length === 0) {
                area.className = '';
                area.innerHTML = `
                    <div class="empty-state">
                        <i class="fas fa-box-open"></i>
                        <h3>Belum ada produk</h3>
                        <p>Produk untuk kategori "${category}" belum tersedia.</p>
                    </div>
                `;
                return;
            }

            area.className = 'products-grid';
            area.innerHTML = '';

            products.forEach((product, index) => {
                const imgHtml = product.gambar 
                    ? `<img src="${product.gambar}" alt="${product.title}" class="product-img" onerror="this.outerHTML='<div class=\\'product-img-placeholder\\'><i class=\\'fas fa-image\\'></i></div>'">`
                    : `<div class="product-img-placeholder"><i class="fas fa-image"></i></div>`;

                const shopeeLink = product.link || '#';
                const desc = product.deskripsi || '';

                const card = document.createElement('div');
                card.className = 'product-card';
                card.style.animationDelay = `${index * 0.1}s`; // Staggered animation
                
                card.innerHTML = `
                    <div class="product-img-wrapper">
                        ${imgHtml}
                    </div>
                    <div class="product-info">
                        <h3>${product.title || 'Tanpa Nama'}</h3>
                        ${desc ? `<p class="description">${desc}</p>` : ''}
                        <a href="${shopeeLink}" target="_blank" class="btn-shopee">
                            <i class="fas fa-shopping-cart"></i> Beli di Shopee
                        </a>
                    </div>
                `;
                area.appendChild(card);
            });
        } catch (error) {
            console.error('Error:', error);
            area.className = '';
            area.innerHTML = '<div class="empty-state" style="color:red;">Gagal memuat produk. Periksa koneksi internet.</div>';
        }
    }

    loadProducts();
</script>

</body>
</html>
