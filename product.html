<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Produk — Scoptus</title>
    <link rel="icon" type="image/png" href="logo.png">
    <script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

    <style>
        :root {
            --midnight: #0a0f1e;
            --navy: #0d1b3e;
            --tosca: #00c8e8;
            --tosca-dim: #0096b7;
            --gold: #f0c060;
            --white: #fafaf8;
            --off-white: #f2f2ef;
            --gray: #8a8a9a;
            --glass: rgba(255,255,255,0.06);
            --glass-border: rgba(255,255,255,0.12);
        }

        *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

        html { scroll-behavior: smooth; }

        body {
            font-family: 'Inter', sans-serif;
            background: var(--off-white);
            color: #1a1a2e;
            line-height: 1.6;
            overflow-x: hidden;
        }

        /* ===== NAVBAR ===== */
        .navbar {
            position: fixed;
            top: 0; left: 0; right: 0;
            z-index: 1000;
            padding: 0 5%;
            height: 68px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            transition: background 0.4s ease, box-shadow 0.4s ease, backdrop-filter 0.4s ease;
        }

        /* Initial: transparent over hero */
        .navbar.top {
            background: transparent;
        }

        /* Scrolled: white with frosted glass */
        .navbar.scrolled {
            background: rgba(255,255,255,0.92);
            backdrop-filter: blur(20px) saturate(180%);
            -webkit-backdrop-filter: blur(20px) saturate(180%);
            box-shadow: 0 2px 32px rgba(0,0,0,0.10);
        }

        .navbar .logo {
            display: flex; align-items: center; gap: 10px;
            text-decoration: none;
        }
        .navbar .logo img {
            height: 36px;
            transition: filter 0.4s ease;
        }
        /* Ketika di atas hero gelap → logo jadi putih */
        .navbar.top .logo img {
            filter: brightness(0) invert(1) drop-shadow(0 0 4px rgba(0,200,232,0.4));
        }
        /* Ketika scrolled → logo normal */
        .navbar.scrolled .logo img {
            filter: none;
        }
        .navbar .logo-text {
            font-family: 'Playfair Display', serif;
            font-size: 1.4rem;
            font-weight: 700;
            transition: color 0.4s;
        }
        .navbar.top .logo-text { color: var(--white); }
        .navbar.scrolled .logo-text { color: var(--navy); }

        .navbar .nav-links { display: flex; gap: 24px; align-items: center; }
        .navbar .nav-links a {
            text-decoration: none;
            font-size: 0.9rem;
            font-weight: 500;
            transition: color 0.3s;
            letter-spacing: 0.02em;
        }
        .navbar.top .nav-links a { color: rgba(255,255,255,0.85); }
        .navbar.scrolled .nav-links a { color: var(--navy); }
        .navbar .nav-links a:hover { color: var(--tosca-dim); }

        /* ===== PARALLAX HERO ===== */
        .parallax-hero {
            position: relative;
            height: 420px;
            overflow: hidden;
            display: flex;
            align-items: flex-end;
            justify-content: center;
        }

        .parallax-bg {
            position: absolute;
            inset: -60px -20px;
            background:
                radial-gradient(ellipse 80% 60% at 60% 40%, rgba(0,200,232,0.18) 0%, transparent 65%),
                radial-gradient(ellipse 60% 50% at 20% 70%, rgba(240,192,96,0.10) 0%, transparent 60%),
                linear-gradient(160deg, #0a0f1e 0%, #0d1b3e 45%, #0a2040 70%, #071528 100%);
            will-change: transform;
        }

        /* Floating orb particles */
        .orb {
            position: absolute;
            border-radius: 50%;
            pointer-events: none;
            animation: floatOrb linear infinite;
            opacity: 0;
        }

        @keyframes floatOrb {
            0%   { transform: translateY(0) scale(1);   opacity: 0; }
            10%  { opacity: 1; }
            90%  { opacity: 1; }
            100% { transform: translateY(-320px) scale(0.6); opacity: 0; }
        }

        /* Grid lines overlay */
        .hero-grid {
            position: absolute;
            inset: 0;
            background-image:
                linear-gradient(rgba(0,200,232,0.04) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0,200,232,0.04) 1px, transparent 1px);
            background-size: 60px 60px;
        }

        /* Hero bottom fade */
        .hero-fade {
            position: absolute;
            bottom: 0; left: 0; right: 0;
            height: 180px;
            background: linear-gradient(to bottom, transparent, var(--off-white));
            pointer-events: none;
        }

        .hero-title-wrap {
            position: relative;
            z-index: 2;
            text-align: center;
            padding-bottom: 60px;
            padding-left: 5%; padding-right: 5%;
        }
        .hero-eyebrow {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: rgba(0,200,232,0.12);
            border: 1px solid rgba(0,200,232,0.25);
            border-radius: 40px;
            padding: 5px 16px;
            font-size: 0.75rem;
            font-weight: 600;
            letter-spacing: 0.12em;
            text-transform: uppercase;
            color: var(--tosca);
            margin-bottom: 14px;
            opacity: 0;
            animation: slideUp 0.6s 0.2s ease forwards;
        }
        .hero-eyebrow .dot {
            width: 6px; height: 6px;
            border-radius: 50%;
            background: var(--tosca);
            animation: blink 1.4s infinite;
        }
        @keyframes blink { 0%,100%{opacity:1} 50%{opacity:0.3} }

        .hero-heading {
            font-family: 'Playfair Display', serif;
            font-size: clamp(1.8rem, 5vw, 3.2rem);
            font-weight: 700;
            color: var(--white);
            line-height: 1.2;
            max-width: 680px;
            margin: 0 auto;
            opacity: 0;
            animation: slideUp 0.7s 0.35s ease forwards;
        }
        .hero-heading em {
            font-style: normal;
            color: var(--gold);
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(24px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        /* ===== BREADCRUMB ===== */
        .breadcrumb-bar {
            max-width: 960px;
            margin: 0 auto;
            padding: 20px 5% 8px;
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 0.82rem;
            color: var(--gray);
        }
        .breadcrumb-bar a { color: var(--tosca-dim); text-decoration: none; transition: color 0.2s; }
        .breadcrumb-bar a:hover { color: var(--tosca); }
        .breadcrumb-bar .sep { color: #ccc; }

        /* ===== PRODUCT AREA ===== */
        .product-outer {
            max-width: 960px;
            margin: 0 auto;
            padding: 10px 5% 80px;
        }

        .product-card {
            background: var(--white);
            border-radius: 28px;
            box-shadow: 0 8px 48px rgba(0,0,0,0.09), 0 1px 3px rgba(0,0,0,0.05);
            overflow: hidden;
            display: grid;
            grid-template-columns: 1.05fr 1fr;
            opacity: 0;
            transform: translateY(32px);
            animation: revealCard 0.75s 0.1s ease forwards;
        }

        @keyframes revealCard {
            to { opacity: 1; transform: translateY(0); }
        }

        /* ===== GALLERY COLUMN ===== */
        .gallery-col {
            position: relative;
            background: #f0f0ed;
        }

        .carousel-main {
            width: 100%;
            aspect-ratio: 3 / 4;
            overflow: hidden;
            position: relative;
        }

        .carousel-track {
            display: flex;
            height: 100%;
            transition: transform 0.45s cubic-bezier(0.77,0,0.18,1);
        }

        .carousel-slide {
            min-width: 100%;
            height: 100%;
        }

        .carousel-slide img {
            width: 100%; height: 100%;
            object-fit: cover;
            display: block;
        }

        .no-img {
            width: 100%; height: 100%;
            display: flex; align-items: center; justify-content: center;
            background: linear-gradient(135deg, #e0e0e0, #f0f0ed);
            color: #ccc; font-size: 5rem;
        }

        /* Carousel controls */
        .carousel-btn {
            position: absolute; top: 50%; transform: translateY(-50%);
            background: rgba(255,255,255,0.90);
            color: var(--navy);
            border: none; width: 40px; height: 40px;
            border-radius: 50%; cursor: pointer; font-size: 0.85rem;
            display: flex; align-items: center; justify-content: center;
            z-index: 3;
            box-shadow: 0 4px 16px rgba(0,0,0,0.15);
            transition: all 0.25s ease;
            backdrop-filter: blur(8px);
        }
        .carousel-btn:hover {
            background: var(--tosca);
            color: white;
            transform: translateY(-50%) scale(1.08);
        }
        .carousel-btn.prev { left: 14px; }
        .carousel-btn.next { right: 14px; }

        /* Slide counter pill */
        .slide-counter {
            position: absolute;
            bottom: 16px; left: 50%; transform: translateX(-50%);
            background: rgba(0,0,0,0.42);
            backdrop-filter: blur(8px);
            color: white;
            font-size: 0.72rem;
            font-weight: 600;
            padding: 4px 12px;
            border-radius: 20px;
            letter-spacing: 0.05em;
            z-index: 3;
            transition: opacity 0.3s;
        }

        /* Thumbnails */
        .thumbnails {
            display: flex;
            gap: 8px;
            padding: 12px 14px;
            overflow-x: auto;
            scrollbar-width: none;
        }
        .thumbnails::-webkit-scrollbar { display: none; }
        .thumb {
            width: 52px; height: 52px;
            border-radius: 10px;
            overflow: hidden;
            cursor: pointer;
            border: 2px solid transparent;
            transition: all 0.2s ease;
            flex-shrink: 0;
            opacity: 0.6;
        }
        .thumb:hover { opacity: 0.85; }
        .thumb.active {
            border-color: var(--tosca);
            opacity: 1;
            box-shadow: 0 0 0 3px rgba(0,200,232,0.18);
        }
        .thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }

        /* ===== INFO COLUMN ===== */
        .info-col {
            padding: 44px 40px 44px 36px;
            display: flex;
            flex-direction: column;
            gap: 0;
        }

        /* Category badge */
        .cat-badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background: rgba(0,200,232,0.08);
            border: 1px solid rgba(0,200,232,0.2);
            color: var(--tosca-dim);
            padding: 5px 14px;
            border-radius: 40px;
            font-size: 0.75rem;
            font-weight: 600;
            letter-spacing: 0.07em;
            text-transform: uppercase;
            width: fit-content;
            margin-bottom: 16px;
            opacity: 0;
            animation: fadeInItem 0.5s 0.5s ease forwards;
        }

        .product-title {
            font-family: 'Playfair Display', serif;
            font-size: clamp(1.25rem, 2.5vw, 1.75rem);
            font-weight: 700;
            color: var(--midnight);
            line-height: 1.3;
            margin-bottom: 20px;
            opacity: 0;
            animation: fadeInItem 0.5s 0.6s ease forwards;
        }

        /* Decorative divider */
        .fancy-divider {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 20px;
            opacity: 0;
            animation: fadeInItem 0.5s 0.65s ease forwards;
        }
        .fancy-divider::before, .fancy-divider::after {
            content: '';
            flex: 1;
            height: 1px;
            background: linear-gradient(90deg, transparent, rgba(0,200,232,0.3), transparent);
        }
        .fancy-divider .diamond {
            width: 6px; height: 6px;
            background: var(--tosca);
            transform: rotate(45deg);
            flex-shrink: 0;
        }

        .product-desc {
            font-size: 0.92rem;
            color: #555;
            line-height: 1.8;
            white-space: pre-line;
            flex: 1;
            margin-bottom: 28px;
            opacity: 0;
            animation: fadeInItem 0.5s 0.7s ease forwards;
        }

        /* Price/feature tags strip */
        .features-strip {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            margin-bottom: 24px;
            opacity: 0;
            animation: fadeInItem 0.5s 0.75s ease forwards;
        }
        .feat-tag {
            display: inline-flex; align-items: center; gap: 5px;
            background: var(--off-white);
            border: 1px solid #e4e4e0;
            border-radius: 8px;
            padding: 5px 12px;
            font-size: 0.78rem;
            font-weight: 500;
            color: #444;
        }
        .feat-tag i { color: var(--tosca-dim); font-size: 0.72rem; }

        /* CTA Button */
        .shopee-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            background: linear-gradient(135deg, #ee4d2d, #ff7043);
            color: white;
            text-decoration: none;
            padding: 17px 28px;
            border-radius: 14px;
            font-size: 1rem;
            font-weight: 700;
            letter-spacing: 0.02em;
            transition: all 0.3s ease;
            box-shadow: 0 6px 24px rgba(238,77,45,0.28);
            position: relative;
            overflow: hidden;
            margin-bottom: 12px;
            opacity: 0;
            animation: fadeInItem 0.5s 0.82s ease forwards;
        }
        .shopee-btn::before {
            content: '';
            position: absolute;
            top: 0; left: -100%;
            width: 60%;
            height: 100%;
            background: linear-gradient(120deg, transparent, rgba(255,255,255,0.18), transparent);
            transition: left 0.5s ease;
        }
        .shopee-btn:hover::before { left: 160%; }
        .shopee-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 12px 32px rgba(238,77,45,0.38);
        }
        .shopee-btn .btn-icon {
            width: 32px; height: 32px;
            background: rgba(255,255,255,0.2);
            border-radius: 8px;
            display: flex; align-items: center; justify-content: center;
            flex-shrink: 0;
        }

        .soft-cta {
            text-align: center;
            font-size: 0.8rem;
            color: var(--gray);
            margin-bottom: 20px;
            opacity: 0;
            animation: fadeInItem 0.5s 0.88s ease forwards;
        }

        /* Back link */
        .back-link {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            color: var(--tosca-dim);
            text-decoration: none;
            font-size: 0.85rem;
            font-weight: 500;
            padding: 8px 0;
            transition: gap 0.2s, color 0.2s;
            opacity: 0;
            animation: fadeInItem 0.5s 0.92s ease forwards;
        }
        .back-link:hover { gap: 12px; color: var(--tosca); }

        @keyframes fadeInItem {
            from { opacity: 0; transform: translateY(14px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        /* ===== LOADING / ERROR ===== */
        .state-wrap {
            text-align: center;
            padding: 100px 20px;
            color: var(--gray);
        }
        .state-wrap i {
            font-size: 3rem;
            display: block;
            margin-bottom: 16px;
        }
        .state-wrap .spin { color: var(--tosca); animation: spin 1s linear infinite; }
        @keyframes spin { 100% { transform: rotate(360deg); } }
        .state-wrap a { color: var(--tosca-dim); }

        /* ===== FOOTER ===== */
        footer {
            background: var(--midnight);
            color: rgba(255,255,255,0.5);
            text-align: center;
            padding: 36px 5%;
        }
        footer .footer-logo {
            font-family: 'Playfair Display', serif;
            font-size: 1.2rem;
            color: rgba(255,255,255,0.8);
            margin-bottom: 8px;
            letter-spacing: 0.05em;
        }
        footer .footer-logo span { color: var(--tosca); }
        footer p { font-size: 0.82rem; }

        /* ===== RESPONSIVE ===== */
        @media (max-width: 720px) {
            .product-card { grid-template-columns: 1fr; border-radius: 20px; }
            .info-col { padding: 28px 24px 36px; }
            .parallax-hero { height: 320px; }
            .hero-heading { font-size: 1.5rem; }
        }
    </style>
</head>
<body>

<!-- NAVBAR -->
<nav class="navbar top" id="navbar">
    <a href="index.html" class="logo">
        <img src="logo.png" alt="Scoptus">
        <span class="logo-text">Scoptus</span>
    </a>
    <div class="nav-links">
        <a href="index.html"><i class="fas fa-home" style="margin-right:5px"></i>Home</a>
    </div>
</nav>

<!-- PARALLAX HERO -->
<div class="parallax-hero" id="heroSection">
    <div class="parallax-bg" id="parallaxBg"></div>
    <div class="hero-grid"></div>
    <div class="hero-fade"></div>

    <div class="hero-title-wrap">
        <div class="hero-eyebrow">
            <div class="dot"></div>
            <span id="heroEyebrow">Detail Produk</span>
        </div>
        <h1 class="hero-heading" id="heroHeading">
            Temukan Produk <em>Pilihan</em> Terbaik
        </h1>
    </div>
</div>

<!-- BREADCRUMB -->
<div class="breadcrumb-bar" id="breadcrumb">
    <a href="index.html">Home</a>
    <span class="sep">›</span>
    <span id="breadcrumbCat">...</span>
    <span class="sep">›</span>
    <span id="breadcrumbTitle" style="color:#333">...</span>
</div>

<!-- PRODUCT AREA -->
<div class="product-outer">
    <div id="productArea">
        <div class="state-wrap">
            <i class="fas fa-spinner spin"></i>
            <p>Memuat produk...</p>
        </div>
    </div>
</div>

<!-- FOOTER -->
<footer>
    <div class="footer-logo">Sco<span>ptus</span></div>
    <p>&copy; 2026 Scoptus. All rights reserved.</p>
</footer>

<script>
    /* ===== PARALLAX + NAVBAR ===== */
    const navbar = document.getElementById('navbar');
    const parallaxBg = document.getElementById('parallaxBg');

    window.addEventListener('scroll', () => {
        const y = window.scrollY;

        // Parallax
        parallaxBg.style.transform = `translateY(${y * 0.38}px)`;

        // Navbar swap
        if (y > 60) {
            navbar.classList.remove('top');
            navbar.classList.add('scrolled');
        } else {
            navbar.classList.remove('scrolled');
            navbar.classList.add('top');
        }
    }, { passive: true });

    /* ===== FLOATING ORBS ===== */
    (function spawnOrbs() {
        const hero = document.getElementById('heroSection');
        const colors = ['rgba(0,200,232,0.55)', 'rgba(240,192,96,0.45)', 'rgba(0,150,183,0.45)'];
        for (let i = 0; i < 14; i++) {
            const orb = document.createElement('div');
            orb.className = 'orb';
            const size = Math.random() * 8 + 3;
            orb.style.cssText = `
                width:${size}px; height:${size}px;
                left:${Math.random()*100}%;
                bottom:${Math.random()*30}%;
                background:${colors[Math.floor(Math.random()*colors.length)]};
                animation-duration:${Math.random()*6+6}s;
                animation-delay:${Math.random()*8}s;
                filter:blur(1px);
            `;
            hero.appendChild(orb);
        }
    })();

    /* ===== CAROUSEL ===== */
    const CSV_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vQKiqz17i6JMHkQaODY2tdLDQeiZEhhbxFA1a7H-xp-Gz3m8MOim4LU9LJy8kf_G-t9s8o4Q8oN0IQV/pub?gid=0&single=true&output=csv';
    const params = new URLSearchParams(window.location.search);
    const productId = params.get('id');

    let currentSlide = 0, totalSlides = 0;

    function goToSlide(idx) {
        currentSlide = idx;
        document.querySelector('.carousel-track').style.transform = `translateX(-${idx * 100}%)`;
        document.querySelectorAll('.thumb').forEach((t, i) => t.classList.toggle('active', i === idx));
        const counter = document.getElementById('slideCounter');
        if (counter) counter.textContent = `${idx + 1} / ${totalSlides}`;
    }

    function slide(dir) {
        goToSlide((currentSlide + dir + totalSlides) % totalSlides);
    }

    function renderProduct(p) {
        const images = (p.gambar || '').split('|').map(u => u.trim()).filter(Boolean);
        totalSlides = images.length || 1;
        const catUrl = `category.html?cat=${encodeURIComponent(p.kategori)}`;

        // Update hero & breadcrumb
        document.getElementById('heroEyebrow').textContent = p.kategori || 'Detail Produk';
        document.getElementById('heroHeading').innerHTML = `${p.title.length > 40 ? p.title.substring(0,40)+'…' : p.title}`;
        document.getElementById('breadcrumbCat').innerHTML = `<a href="${catUrl}" style="color:var(--tosca-dim);text-decoration:none">${p.kategori}</a>`;
        document.getElementById('breadcrumbTitle').textContent = p.title;
        document.title = `${p.title} — Scoptus`;

        const slidesHtml = images.length > 0
            ? images.map(url => `
                <div class="carousel-slide">
                    <img src="${url}" alt="${p.title}" loading="lazy"
                         onerror="this.parentElement.innerHTML='<div class=\\'no-img\\'><i class=\\'fas fa-image\\'></i></div>'">
                </div>`).join('')
            : `<div class="carousel-slide"><div class="no-img"><i class="fas fa-image"></i></div></div>`;

        const thumbsHtml = images.length > 1
            ? `<div class="thumbnails">${images.map((url, i) => `
                <div class="thumb ${i===0?'active':''}" onclick="goToSlide(${i})">
                    <img src="${url}" alt="">
                </div>`).join('')}</div>`
            : '';

        const btnHtml = images.length > 1 ? `
            <button class="carousel-btn prev" onclick="slide(-1)"><i class="fas fa-chevron-left"></i></button>
            <button class="carousel-btn next" onclick="slide(1)"><i class="fas fa-chevron-right"></i></button>
            <div class="slide-counter" id="slideCounter">1 / ${totalSlides}</div>` : '';

        // Feature tags
        const tags = [
            `<span class="feat-tag"><i class="fas fa-shield-halved"></i> Produk Resmi</span>`,
            `<span class="feat-tag"><i class="fas fa-truck-fast"></i> Pengiriman Cepat</span>`,
            `<span class="feat-tag"><i class="fas fa-rotate-left"></i> Garansi Toko</span>`,
        ].join('');

        document.getElementById('productArea').innerHTML = `
            <div class="product-card">
                <!-- GALLERY -->
                <div class="gallery-col">
                    <div class="carousel-main">
                        <div class="carousel-track">${slidesHtml}</div>
                        ${btnHtml}
                    </div>
                    ${thumbsHtml}
                </div>

                <!-- INFO -->
                <div class="info-col">
                    <span class="cat-badge"><i class="fas fa-tag"></i> ${p.kategori}</span>
                    <h1 class="product-title">${p.title}</h1>

                    <div class="fancy-divider"><div class="diamond"></div></div>

                    ${p.deskripsi ? `<p class="product-desc">${p.deskripsi}</p>` : ''}

                    <div class="features-strip">${tags}</div>

                    <a href="${p.link}" target="_blank" rel="noopener" class="shopee-btn">
                        <div class="btn-icon"><i class="fas fa-shopping-cart"></i></div>
                        <span>Beli di Shopee</span>
                        <i class="fas fa-arrow-right" style="margin-left:auto;opacity:0.7"></i>
                    </a>
                    <p class="soft-cta">Temukan pilihan lengkapnya di Shopee 🛍️</p>

                    <a href="${catUrl}" class="back-link">
                        <i class="fas fa-arrow-left"></i>
                        Lihat produk <strong>${p.kategori}</strong> lainnya
                    </a>
                </div>
            </div>
        `;
    }

    async function loadProduct() {
        const area = document.getElementById('productArea');
        if (!productId) {
            area.innerHTML = `<div class="state-wrap">
                <i class="fas fa-box-open" style="color:#ccc"></i>
                <p>Produk tidak ditemukan.</p>
                <a href="index.html">← Kembali ke Home</a>
            </div>`;
            return;
        }
        try {
            const res = await fetch(CSV_URL);
            const text = await res.text();
            const parsed = Papa.parse(text, { header: true, skipEmptyLines: true });
            const product = parsed.data.find(p => String(p.id).trim() === String(productId).trim());
            if (!product) {
                area.innerHTML = `<div class="state-wrap">
                    <i class="fas fa-box-open" style="color:#ccc"></i>
                    <p>Produk tidak ditemukan.</p>
                    <a href="index.html">← Kembali ke Home</a>
                </div>`;
                return;
            }
            renderProduct(product);
        } catch(e) {
            area.innerHTML = `<div class="state-wrap">
                <i class="fas fa-exclamation-triangle" style="color:#f0a040"></i>
                <p>Gagal memuat produk. Coba refresh halaman.</p>
            </div>`;
        }
    }

    loadProduct();
</script>
</body>
</html>
